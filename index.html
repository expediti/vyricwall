<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f0" />
    <meta name="description" content="Vyric is a retro-styled digital wallpaper database. Create unique 4K wallpapers for phone and laptop." />
    <meta name="keywords" content="digital wallpaper, retro wallpaper, 4K background, phone wallpaper, laptop wallpaper, minimalist, pixel art" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Base -->
    <meta property="og:site_name" content="Vyric OS" />
    <meta property="og:locale" content="en_US" />
    
    <title>Vyric - Retro OS Wallpapers</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['VT323', 'monospace'],
              display: ['VT323', 'monospace'],
              mono: ['VT323', 'monospace'],
            },
            colors: {
              retro: {
                bg: '#f0f0f0', /* Old Computer White/Beige */
                text: '#1c1917',
                orange: '#ff4500',
                black: '#1c1917',
                dim: '#e5e5e5',
              }
            },
            boxShadow: {
              'retro': '4px 4px 0 0 #1c1917',
              'retro-sm': '2px 2px 0 0 #1c1917',
              'retro-hover': '6px 6px 0 0 #1c1917',
              'retro-orange': '4px 4px 0 0 #ff4500',
            },
            backgroundImage: {
              'dot-pattern': 'radial-gradient(#1c1917 1.5px, transparent 1.5px)',
              'dot-pattern-dark': 'radial-gradient(#ffffff 1.5px, transparent 1.5px)',
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'VT323', monospace; 
        background-color: #f0f0f0;
        color: #1c1917;
      }
      
      /* Retro Scrollbar */
      ::-webkit-scrollbar {
        width: 16px;
      }
      ::-webkit-scrollbar-track {
        background: #f0f0f0; 
        border-left: 2px solid #1c1917;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1c1917; 
        border-left: 2px solid #ffffff;
      }
      ::-webkit-scrollbar-thumb {
        background: #ff4500; 
        border: 2px solid #1c1917;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1c1917; 
      }

      /* No smooth scroll for retro feel */
      html {
        scroll-behavior: auto;
      }

      .bg-dot-grid {
        background-size: 20px 20px;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.84.0"
  }
}
</script>
</head>
  <body class="bg-retro-bg dark:bg-retro-black text-retro-text dark:text-white transition-colors duration-0 selection:bg-retro-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
